name: ZCode MMX offline regression

on:
  pull_request:
    paths:
      - ".github/workflows/zmx-offline.yml"
      - "skills/zcode/**"
      - "skills/mmx/**"
      - "skills/zcode-mmx-review/**"
      - "scripts/windows-zmx-check.*"
      - "tests/windows-zmx-check.test.cjs"
      - "docs/windows10-zmx.md"
      - "docs/windows11-zmx.md"
  push:
    branches:
      - "cloud/**"
      - "windows-zmx-*"
    paths:
      - ".github/workflows/zmx-offline.yml"
      - "skills/zcode/**"
      - "skills/mmx/**"
      - "skills/zcode-mmx-review/**"
      - "scripts/windows-zmx-check.*"
      - "tests/windows-zmx-check.test.cjs"
      - "docs/windows10-zmx.md"
      - "docs/windows11-zmx.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zmx-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Runtime and syntax
        run: |
          node --version
          node --check skills/zcode/scripts/zcode-chat.js
          node --check skills/zcode/scripts/zcode-run.js
          node --check skills/zcode/scripts/zcode-batch.js
          node --check skills/mmx/scripts/mmx-chat.js
          node --check skills/mmx/scripts/fetch-timeout-guard.js
          node --check skills/mmx/scripts/mmx-batch.js
          node --check skills/mmx/scripts/mmx-job.js
          node --check skills/mmx/scripts/mmx-provider-slot.js
          node --check skills/zcode-mmx-review/scripts/review-run.js
          node --check skills/zcode-mmx-review/scripts/shard-coverage.js
      - name: ZCode release manifest repin consistency
        run: |
          node skills/zcode/scripts/repin-release.js
          git diff --exit-code -- skills/zcode/.zcode-release.json
      - name: Windows operations helper regression
        run: node --test tests/windows-zmx-check.test.cjs
      - name: Windows PowerShell 5.1 acceptance in a space and Unicode path
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'This step must run Windows PowerShell 5.1' }
          $unicode = [string][char]0x4e2d + [char]0x6587
          $copyRoot = Join-Path $env:RUNNER_TEMP ('zmx ' + $unicode + ' ' + [Guid]::NewGuid().ToString('N'))
          $skillsRoot = Join-Path $copyRoot 'skills'
          New-Item -ItemType Directory -Path $skillsRoot | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $copyRoot 'scripts') | Out-Null
          foreach ($skill in @('zcode', 'mmx', 'zcode-mmx-review')) {
            Copy-Item -LiteralPath (Join-Path 'skills' $skill) -Destination $skillsRoot -Recurse -Force
          }
          Copy-Item -LiteralPath 'scripts/windows-zmx-check.ps1', 'scripts/windows-zmx-check.cjs' -Destination (Join-Path $copyRoot 'scripts')
          $reportPath = Join-Path $env:RUNNER_TEMP 'windows-zmx-check.json'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $copyRoot 'scripts/windows-zmx-check.ps1') -Offline -JobsRoot (Join-Path $copyRoot 'job data') -ReportPath $reportPath
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 5.1 offline acceptance failed; inspect the uploaded report and logs' }
          $report = Get-Content -LiteralPath $reportPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($report.readiness -ne 'offline_pass' -or $report.real_provider_requests -ne 0) { throw 'Unexpected acceptance scope' }
          if ($report.environment.powershell.version -notlike '5.1.*') { throw 'PowerShell 5.1 evidence is missing' }
          Write-Host "Observed host: $($report.environment.host_class); this does not constitute Windows 10 native acceptance."
          # Hosted Windows Server is NOT a Windows 11 client, even when its
          # offline diagnostics succeed.
          $win11Report = Join-Path $env:RUNNER_TEMP 'windows-zmx-check.json.win11'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $copyRoot 'scripts/windows-zmx-check.ps1') -Offline -TargetOs windows11 -JobsRoot (Join-Path $copyRoot 'job data 11') -ReportPath $win11Report
          if ($LASTEXITCODE -ne 0) { throw 'Windows 11 offline diagnostic failed' }
          $diagnostic = Get-Content -LiteralPath $win11Report -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($diagnostic.readiness -ne 'offline_pass' -or $diagnostic.requested_target -ne 'windows11' -or $diagnostic.target_match -ne $false -or $diagnostic.observed_host -ne 'windows_server' -or $diagnostic.acceptance_scope -ne 'offline_diagnostics_only') {
            throw 'Windows Server must not be promoted to Windows 11 compatibility'
          }
      - name: Windows acceptance evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-powershell51-offline-evidence
          path: ${{ runner.temp }}/windows-zmx-check.json*
          if-no-files-found: warn
      - name: ZCode offline regression
        run: node --test skills/zcode/tests/*.test.js
      - name: MMX offline regression
        run: node --test skills/mmx/tests/*.test.js
      - name: Cross-review offline regression
        run: node --test skills/zcode-mmx-review/tests/*.test.js
      - name: Unified runner offline doctor
        run: node skills/zcode-mmx-review/scripts/review-run.js doctor --offline --json
