name: ZCode MMX offline regression

on:
  pull_request:
    paths:
      - ".github/workflows/zmx-offline.yml"
      - "Mac交叉验证.command"
      - "scripts/mac-review.js"
      - "tests/mac-review-launcher.test.js"
      - "skills/zcode/**"
      - "skills/mmx/**"
      - "skills/zcode-mmx-review/**"
  push:
    branches:
      - "cloud/**"
      - "codex/mac-shard-request-budget"
    paths:
      - ".github/workflows/zmx-offline.yml"
      - "Mac交叉验证.command"
      - "scripts/mac-review.js"
      - "tests/mac-review-launcher.test.js"
      - "skills/zcode/**"
      - "skills/mmx/**"
      - "skills/zcode-mmx-review/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zmx-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline contract (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22"]
        include:
          - os: macos-latest
            node: "24"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Runtime and syntax
        run: |
          node --version
          node --check skills/zcode/scripts/zcode-chat.js
          node --check skills/zcode/scripts/zcode-run.js
          node --check skills/zcode/scripts/zcode-batch.js
          node --check skills/mmx/scripts/mmx-chat.js
          node --check skills/mmx/scripts/fetch-timeout-guard.js
          node --check skills/mmx/scripts/mmx-batch.js
          node --check skills/mmx/scripts/mmx-job.js
          node --check skills/mmx/scripts/mmx-provider-slot.js
          node --check skills/zcode-mmx-review/scripts/review-run.js
          node --check skills/zcode-mmx-review/scripts/shard-coverage.js
      - name: ZCode offline regression
        run: node --test skills/zcode/tests/*.test.js
      - name: MMX offline regression
        run: node --test skills/mmx/tests/*.test.js
      - name: Cross-review offline regression
        run: node --test skills/zcode-mmx-review/tests/*.test.js
      - name: Finder and terminal launcher
        if: runner.os == 'macOS'
        run: node --test tests/mac-review-launcher.test.js
      - name: Mac MMX lifecycle with host proxy variables
        if: runner.os == 'macOS'
        env:
          HTTPS_PROXY: http://proxy.invalid:8080
          MINIMAX_BASE_URL: https://model.invalid/v1
        run: node --test --test-name-pattern='launcher|preflight|private entry' skills/mmx/tests/mmx-chat.test.js
      - name: Unified runner offline doctor
        run: node skills/zcode-mmx-review/scripts/review-run.js doctor --offline --json
