name: ZMX isolated offline CI

on:
  push:
    branches: [main, fix/zmx-main-timeout-stability-20261125]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-linux:
    name: Node 22 Linux isolated fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Identify candidate
        run: |
          git rev-parse HEAD
          node --version
      - name: Isolated ZCode fixtures
        run: bash .github/scripts/zmx-isolated-test.sh node --test 'skills/zcode/tests/**/*.test.js'
      - name: Isolated MMX fixtures
        run: bash .github/scripts/zmx-isolated-test.sh node --test 'skills/mmx/tests/**/*.test.js'
      - name: Isolated cross-review fixtures
        run: bash .github/scripts/zmx-isolated-test.sh node --test 'skills/zcode-mmx-review/tests/**/*.test.js'
      - name: Isolated offline doctor
        run: bash .github/scripts/zmx-isolated-test.sh node skills/zcode-mmx-review/scripts/review-run.js doctor --offline --json

  native-syntax-only:
    name: Native syntax only (no lifecycle acceptance) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Syntax checks only
        run: |
          set -euo pipefail
          git rev-parse HEAD
          node --version
          node --check skills/zcode/scripts/zcode-chat.js
          node --check skills/zcode/scripts/zcode-run.js
          node --check skills/zcode/scripts/zcode-batch.js
          node --check skills/mmx/scripts/mmx-chat.js
          node --check skills/mmx/scripts/mmx-batch.js
          node --check skills/zcode-mmx-review/scripts/review-run.js
          if [[ -f skills/mmx/scripts/fetch-timeout-guard.js ]]; then node --check skills/mmx/scripts/fetch-timeout-guard.js; fi
          echo "NATIVE_ACCEPTANCE=NOT_EVALUATED: verified native network isolation not yet available"

  python-linux:
    name: Python 3.11 Linux isolated fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies (before isolation)
        run: python -m pip install -r requirements.txt
      - name: Identify candidate
        run: |
          git rev-parse HEAD
          python --version
      - name: Isolated root tests
        run: bash .github/scripts/zmx-isolated-test.sh python -m pytest tests -q
      - name: Isolated modern-thinking-tools tests
        run: bash .github/scripts/zmx-isolated-test.sh python -m pytest skills/modern-thinking-tools/tests -q
      - name: Isolated lead-acquisition-coach tests
        run: bash .github/scripts/zmx-isolated-test.sh python -m pytest skills/lead-acquisition-coach/tests -q
